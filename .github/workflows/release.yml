name: Windows installer release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and test
        run: dotnet test TestAgent.slnx -c Release --nologo
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\build-installer.ps1 -Version $version -SkipTests
      - uses: actions/upload-artifact@v7
        with:
          name: k-netagent-windows-installer
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = Get-ChildItem artifacts/installer -File | ForEach-Object FullName
          if (gh release view $tag 2>$null) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --verify-tag --generate-notes --title "K.netagent $tag"
          }
